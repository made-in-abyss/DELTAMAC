<!DOCTYPE html>
<html>
<head>
    <title>DELTAMAC</title>
</head>
<body>
    <h1>DELTAMAC</h1>

    <button id="time-play-btn">Play [TIMED]</button><br>
    <button id="accu-play-btn">Play [ACCURACY]</button>
    <br>
    <br>
    timer [or questions] = <input id="timer" type="number" value="120"></input>
    score = <input id="score-field" type="number" value="0"></input>
    <br>
    <br>
    question = <textarea id="question-text" readonly>a+b</textarea>
    answer = <input id="answer-input" type="number">
    <br>
    <br>
    <br>
    <br>
    [+- limiter]:<br>
        a_lower = <input id="a-add-lower" type="number" value="2">
        a_higher= <input id="a-add-higher" type="number" value="100">
        <br>
        b_lower = <input id="b-add-lower" type="number" value="2">
        b_higher= <input id="b-add-higher" type="number" value="100">
    <br>
    <br>
    [*/ limiter]:<br>
        a_lower = <input id="a-mul-lower" type="number" value="2">
        a_higher= <input id="a-mul-higher" type="number" value="12">
        <br>
        b_lower = <input id="b-mul-lower" type="number" value="2">
        b_higher= <input id="b-mul-higher" type="number" value="12">
    <script src="engine.js"></script>
    <footer>
        <br>
        See me on Github: <a href="https://github.com/made-in-abyss/DELTAMAC" target="_blank">View on GitHub</a>
        <br>
        Loves from Firlance :3
    </footer>
</body>
</html>
